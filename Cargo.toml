[package]
name = "vigem-rust"
version = "0.2.0"
edition = "2024"
# Keep in sync with the msrv job in .github/workflows/ci.yml
rust-version = "1.88"
authors = ["arounre"]
description = "Virtual Xbox 360 and DualShock 4 controllers on Windows via ViGEmBus."
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/arounre/vigem-rust"
keywords = ["vigem", "gamepad", "controller", "virtual", "xinput"]
categories = ["hardware-support", "os::windows-apis", "game-development"]
autobenches = false

[dependencies]
bitflags = "2.13"
thiserror = "2"
serde = { version = "1", optional = true, default-features = false, features = ["derive", "alloc"] }

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_System",
    "Win32_System_Ioctl",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Storage_FileSystem",
    "Win32_Security",
]

[features]
default = ["x360", "ds4"]
x360 = []
ds4 = []
# Off by default so `windows` stays a private dependency for semver.
# Enabling it exposes `windows::core::Error` in the public API (breaking if
# `windows` majors). See rustdoc on `Win32Error::to_windows_error`.
windows-error = []
# Serialize/deserialize reports, notifications, and related value types.
serde = ["dep:serde", "bitflags/serde"]

[[example]]
name = "x360"
required-features = ["x360"]

[[example]]
name = "ds4"
required-features = ["ds4"]

[[example]]
name = "ds4_touch"
required-features = ["ds4"]

[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-pc-windows-msvc"
targets = []
rustdoc-args = [
    "--cfg", "docsrs",
    "-Zunstable-options",
    "--generate-link-to-definition",
]

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
serde_json = "1"

[[bench]]
name = "latency"
harness = false
required-features = ["x360"]
